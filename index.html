<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>struc</title>

<link rel="icon" type="image/png" href="struc.png">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#ffffff;
  color:#000;
  font-family:"Times New Roman", serif;
  overflow-x:hidden;
}

/* GIF TEXTURE (çok hafif) */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("strucbackground.gif");
  background-size:300px;
  opacity:0.035;
  pointer-events:none;
}

/* CURSOR */
.cursor{
  position:fixed;
  width:260px;
  height:260px;
  background:radial-gradient(circle, rgba(0,0,0,0.06) 0%, transparent 70%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:0;
}

/* HEADER (cursor etkisini keser) */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
  background:#fff;
}

.logo-gif{
  height:50px;
}

nav a{
  margin-left:20px;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  bottom:-4px;
  left:0;
  width:0;
  height:1px;
  background:black;
  transition:.4s;
}

nav a:hover::after{
  width:100%;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 60px;
}

.hero h1{
  font-size:90px;
  line-height:0.85;
  margin:0;
  max-width:600px;
  letter-spacing:-2px;
}

.hero p{
  margin-top:20px;
  font-size:16px;
  max-width:400px;
  color:#444;
}

/* POSTS */
.posts{
  padding:100px 60px;
}

.post{
  margin-bottom:70px;
  cursor:pointer;
  transition:.3s;
}

.post h2{
  font-size:30px;
  margin:0;
  position:relative;
}

.post h2::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  width:0;
  height:1px;
  background:black;
  transition:.4s;
}

.post:hover h2::after{
  width:100%;
}

.post:hover{
  transform:translateX(6px);
}

.post p{
  font-size:14px;
  max-width:500px;
  color:#555;
  margin-top:10px;
}

/* ABOUT */
.about{
  padding:100px 60px;
  border-top:1px solid black;
}

.about p{
  max-width:500px;
}

.social{
  margin-top:20px;
}

.social img{
  width:18px;
  margin-right:15px;
  opacity:.6;
  transition:.3s;
}

.social img:hover{
  opacity:1;
  transform:scale(1.1);
}

/* RESPONSIVE */
@media(max-width:700px){
  .hero h1{font-size:50px}
  .hero{padding:0 20px}
  .posts,.about{padding:60px 20px}
}
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<header>
  <img src="struc.gif" class="logo-gif">
  <nav>
    <a href="#">home</a>
    <a href="#about">about</a>
  </nav>
</header>

<section class="hero">
  <h1>structure<br>and silence</h1>
  <p>a simple blog about architecture and strange buildings</p>
</section>

<section class="posts">

  <div class="post">
    <h2>Brutalism: the most honest form of concrete</h2>
    <p>is it cold or just real?</p>
  </div>

  <div class="post">
    <h2>urban renewal and memory</h2>
    <p>what happens when cities forget?</p>
  </div>

</section>

<section class="about" id="about">
  <p>hi, i'm semih. i write about architecture in a simple way.</p>

  <div class="social">
    <a href="https://instagram.com/semihhhfz"><img src="instagramicon.PNG"></a>
    <a href="https://youtube.com/@semihsf"><img src="youtubeicon.PNG"></a>
  </div>
</section>

<script>
const cursor = document.getElementById("cursor");

document.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
